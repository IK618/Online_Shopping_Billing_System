<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create, Manage, and Localize Your Digital Invoices - FastSpring</title>
  
  <!-- FastSpring Brand Typography (Figtree) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel for Component Architecture -->
  <script src="/web/vendor/react.production.min.js"></script>
  <script src="/web/vendor/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --main-font: 'Figtree', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --main-link-color: #1479ce;
      --primary-orange: #ff772a;
      --primary-orange-hover: #e05e13;
      --main-heading-color: #16181a;
      --main-text-color: #5a6266;
      --bg-light: #f8fafc;
      --border-color: #ececec;
      --border-blue: #b3dcff;
      --card-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--main-font);
      color: var(--main-text-color);
      background-color: #ffffff;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    /* TOP ANNOUNCEMENT BANNER */
    .top-announcement {
      background-color: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 10px 24px;
      font-size: 0.88rem;
      color: var(--main-heading-color);
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    .top-announcement a {
      color: var(--main-link-color);
      text-decoration: underline;
      font-weight: 600;
      margin-left: 6px;
      cursor: pointer;
    }

    /* GLOBAL HEADER & NAVIGATION BAR */
    header.fs-nav {
      position: sticky;
      top: 0;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
      padding: 0 48px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .fs-nav-left {
      display: flex;
      align-items: center;
      gap: 40px;
    }
    .fs-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
    }
    .fs-logo img {
      height: 32px;
      width: auto;
    }
    .fs-nav-links {
      display: flex;
      align-items: center;
      list-style: none;
      gap: 30px;
    }
    .fs-nav-links li a {
      color: var(--main-heading-color);
      text-decoration: none;
      font-size: 0.96rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: color 0.15s ease;
    }
    .fs-nav-links li a:hover {
      color: var(--main-link-color);
    }
    .fs-nav-links li a .chevron {
      font-size: 0.72rem;
      color: #94a3b8;
    }

    .fs-nav-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .fs-nav-right .icon-btn {
      background: transparent;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--main-heading-color);
    }
    .fs-nav-right a.nav-text-link {
      color: var(--main-heading-color);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .fs-nav-right a.nav-text-link:hover {
      color: var(--main-link-color);
    }
    .fs-btn-orange {
      background-color: var(--primary-orange);
      color: #ffffff !important;
      padding: 11px 24px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background-color 0.18s ease, transform 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .fs-btn-orange:hover {
      background-color: var(--primary-orange-hover);
      transform: translateY(-1px);
    }
    .fs-btn-outline {
      background-color: transparent;
      color: var(--main-heading-color);
      border: 1px solid var(--border-color);
      padding: 11px 24px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.18s ease, color 0.18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .fs-btn-outline:hover {
      border-color: var(--main-heading-color);
      color: #000000;
    }

    /* HERO SECTION */
    .fs-hero {
      position: relative;
      background: linear-gradient(180deg, #F0F7FD 0%, #FFFFFF 100%);
      padding: 60px 20px 40px 20px;
      text-align: center;
      overflow: hidden;
    }
    .fs-badge-roi {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border: 1px solid #fed7aa;
      color: #ea580c;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 18px;
      border-radius: 9999px;
      margin-bottom: 24px;
      box-shadow: 0 4px 12px rgba(251, 146, 60, 0.1);
    }
    .fs-hero h1 {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--main-heading-color);
      letter-spacing: -0.035em;
      line-height: 1.15;
      max-width: 900px;
      margin: 0 auto 12px auto;
    }
    .fs-hero h1 .blue-line {
      color: var(--main-link-color);
      display: block;
    }
    .fs-hero p.subtitle {
      font-size: 1.15rem;
      color: var(--main-text-color);
      max-width: 780px;
      margin: 0 auto 32px auto;
      line-height: 1.6;
    }
    .fs-hero-ctas {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 50px;
    }
    .fs-hero-mockup-wrap {
      max-width: 1040px;
      margin: 0 auto;
      position: relative;
    }
    .fs-hero-mockup-wrap img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.08));
    }

    /* SECTION BADGE & TITLE */
    .fs-section-header {
      text-align: center;
      margin: 90px 0 50px 0;
    }
    .fs-section-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .fs-section-badge img {
      width: 44px;
      height: 44px;
    }
    .fs-section-title {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--main-heading-color);
      letter-spacing: -0.03em;
    }

    /* KEY FEATURES & BENEFITS BLUE CARD CONTAINER */
    .fs-feature-container {
      max-width: 1200px;
      margin: 0 auto 80px auto;
      border: 1.5px solid var(--border-blue);
      border-radius: 28px;
      padding: 60px 50px;
      background: #ffffff;
      display: grid;
      grid-template-columns: 1.25fr 0.95fr;
      gap: 50px;
      align-items: center;
      box-shadow: 0 10px 30px rgba(20, 121, 206, 0.04);
    }
    .fs-feature-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 40px;
      row-gap: 36px;
    }
    .fs-feature-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .fs-feature-item-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .fs-check-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .fs-feature-item h3 {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--main-link-color);
      line-height: 1.35;
    }
    .fs-feature-item p {
      font-size: 0.92rem;
      color: var(--main-text-color);
      line-height: 1.55;
      padding-left: 32px;
    }
    .fs-feature-mockup img {
      width: 100%;
      height: auto;
      border-radius: 16px;
    }

    /* INTERACTIVE APPLICATION WORKSPACE SECTION */
    .fs-app-workspace {
      max-width: 1280px;
      margin: 0 auto 90px auto;
      padding: 0 20px;
    }
    .fs-app-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }
    .fs-app-nav-tabs {
      display: flex;
      background: #f8fafc;
      border-bottom: 1px solid var(--border-color);
      padding: 0 20px;
      gap: 10px;
    }
    .fs-tab-btn {
      padding: 18px 24px;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--main-text-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.18s ease;
    }
    .fs-tab-btn.active {
      color: var(--main-link-color);
      border-bottom-color: var(--main-link-color);
      background: #ffffff;
    }
    .fs-tab-content {
      padding: 36px 40px;
    }

    /* STOREFRONT & QUOTE BUILDER */
    .store-layout {
      display: grid;
      grid-template-columns: 1.6fr 1.2fr;
      gap: 36px;
    }
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .sku-item {
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px;
      background: #ffffff;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .sku-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.06);
      border-color: var(--main-link-color);
    }
    .sku-cat {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--main-link-color);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .sku-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--main-heading-color);
      margin: 8px 0;
      line-height: 1.3;
    }
    .sku-price {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--main-heading-color);
    }
    .sku-stock {
      font-size: 0.8rem;
      font-weight: 600;
      color: #10b981;
      margin-top: 4px;
    }

    /* FASTSPRING INVOICE PREVIEW DRAWER */
    .invoice-card {
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      padding: 28px;
      background: #fbfcfe;
    }
    .invoice-card h3 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--main-heading-color);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart-table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }
    .cart-table th {
      text-align: left;
      font-size: 0.82rem;
      color: #64748b;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }
    .cart-table td {
      padding: 12px 0;
      font-size: 0.92rem;
      border-bottom: 1px solid #f1f5f9;
      color: var(--main-heading-color);
    }
    .cart-table input[type=number]::-webkit-inner-spin-button,
    .cart-table input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .cart-table input[type=number] {
      -moz-appearance: textfield;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 0.92rem;
      color: var(--main-text-color);
    }
    .summary-row.total-bold {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--main-heading-color);
      border-top: 2px solid var(--border-color);
      padding-top: 14px;
      margin-top: 10px;
    }

    /* DIJKSTRA LOGISTICS VISUALIZER */
    .route-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-top: 20px;
    }
    .route-metric-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .route-metric-item {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
    }
    .route-metric-item .label {
      font-size: 0.75rem;
      color: var(--main-text-color);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .route-metric-item .val {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--main-heading-color);
      margin-top: 4px;
    }

    /* FASTSPRING 3-PILLAR SECTION */
    .fs-pillars-section {
      max-width: 1200px;
      margin: 80px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }
    .fs-pillars-content h2 {
      font-size: 2.3rem;
      font-weight: 800;
      color: var(--main-heading-color);
      letter-spacing: -0.03em;
      margin-bottom: 16px;
    }
    .fs-pillar-item {
      margin-top: 28px;
    }
    .fs-pillar-item h3 {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--main-heading-color);
      margin-bottom: 6px;
    }
    .fs-pillar-item p {
      font-size: 0.95rem;
      color: var(--main-text-color);
      line-height: 1.55;
    }
    .fs-pillars-image img {
      width: 100%;
      height: auto;
      border-radius: 20px;
    }

    /* TESTIMONIAL CARDS WITH REAL AVATARS & G2 ICON */
    .fs-testimonials {
      max-width: 1200px;
      margin: 70px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }
    .fs-quote-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .fs-quote-card h4 {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--main-heading-color);
      margin-bottom: 12px;
    }
    .fs-quote-card p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--main-text-color);
      margin-bottom: 20px;
    }
    .fs-quote-footer {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .fs-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
    }
    .fs-quote-author {
      font-weight: 700;
      color: var(--main-heading-color);
      font-size: 0.92rem;
    }
    .fs-quote-title {
      font-size: 0.82rem;
      color: #64748b;
    }

    /* READY TO GET STARTED BOTTOM CTA */
    .fs-bottom-cta {
      max-width: 1200px;
      margin: 90px auto;
      padding: 60px 40px;
      background: #f8fafc;
      border-radius: 32px;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 50px;
      align-items: center;
    }
    .fs-bottom-cta-img img {
      width: 100%;
      height: auto;
      border-radius: 20px;
    }
    .fs-bottom-cta-content h2 {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--main-heading-color);
      letter-spacing: -0.03em;
      margin-bottom: 14px;
    }
    .fs-bottom-cta-content p {
      font-size: 1.05rem;
      color: var(--main-text-color);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* FASTSPRING FOOTER */
    footer.fs-footer {
      background: #ffffff;
      border-top: 1px solid var(--border-color);
      padding: 70px 48px 40px 48px;
    }
    .fs-footer-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
      gap: 40px;
      margin-bottom: 50px;
    }
    .fs-footer-col h5 {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--main-heading-color);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }
    .fs-footer-col ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .fs-footer-col ul li a {
      color: var(--main-text-color);
      font-size: 0.9rem;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .fs-footer-col ul li a:hover {
      color: var(--main-link-color);
    }
    .fs-footer-bottom {
      max-width: 1200px;
      margin: 0 auto;
      border-top: 1px solid var(--border-color);
      padding-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    /* MODAL POPUPS */
    .fs-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fs-modal-box {
      background: #ffffff;
      border-radius: 20px;
      width: 90%;
      max-width: 520px;
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }
    .fs-modal-box h3 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--main-heading-color);
      margin-bottom: 8px;
    }
    .fs-input-field {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.95rem;
      margin-top: 6px;
      margin-bottom: 16px;
      font-family: inherit;
      outline: none;
    }
    .fs-input-field:focus {
      border-color: var(--main-link-color);
      box-shadow: 0 0 0 3px rgba(20, 121, 206, 0.15);
    }
  </style>
</head>
<body>

  <!-- REACT ROOT CONTAINER -->
  <div id="root"></div>

  <!-- REACT 18 APPLICATION SCRIPT -->

          .then(setRouteInfo);
      };

      const addToCart = (pid) => {
        const p = products.find(x => x.product_id == pid);
        if (!p) return;
        const currentQty = cart[pid] || 0;
        if (currentQty >= p.stock) {
          alert(`Insufficient stock. Only ${p.stock} units available for ${p.name}.`);
          return;
        }
        setCart(prev => ({ ...prev, [pid]: currentQty + 1 }));
      };

      const incrementCart = (pid) => {
        const p = products.find(x => x.product_id == pid);
        if (!p) return;
        const currentQty = cart[pid] || 0;
        if (currentQty >= p.stock) {
          alert(`Maximum available stock (${p.stock}) reached for ${p.name}.`);
          return;
        }
        setCart(prev => ({ ...prev, [pid]: currentQty + 1 }));
      };

      const decrementCart = (pid) => {
        setCart(prev => {
          const currentQty = prev[pid] || 0;
          if (currentQty <= 1) {
            const next = { ...prev };
            delete next[pid];
            return next;
          }
          return { ...prev, [pid]: currentQty - 1 };
        });
      };

      const updateCartQuantity = (pid, valStr) => {
        const p = products.find(x => x.product_id == pid);
        if (!p) return;
        const parsed = parseInt(valStr, 10);
        if (isNaN(parsed) || parsed <= 0) {
          setCart(prev => {
            const next = { ...prev };
            delete next[pid];
            return next;
          });
          return;
        }
        if (parsed > p.stock) {
          alert(`Only ${p.stock} units in stock for ${p.name}. Quantity adjusted to available limit.`);
          setCart(prev => ({ ...prev, [pid]: p.stock }));
          return;
        }
        setCart(prev => ({ ...prev, [pid]: parsed }));
      };

      const removeFromCart = (pid) => {
        setCart(prev => {
          const next = { ...prev };
          delete next[pid];
          return next;
        });
      };

      const clearCart = () => setCart({});

      // Calculations
      const cartKeys = Object.keys(cart);
      let subtotal = 0;
      let totalItems = 0;
      cartKeys.forEach(pid => {
        const p = products.find(x => x.product_id == pid);
        if (p) {
          subtotal += p.price * cart[pid];
          totalItems += cart[pid];
        }
      });

      let discount = currentUser.is_premium ? subtotal * 0.10 : 0.0;
      if (promoCode === 'SMART10') {
        discount += subtotal * 0.10;
      }

                  <li><a href="#">API Reference</a></li>
                  <li><a href="#">System Status</a></li>
                  <li><a href="#">Contact Support</a></li>
                </ul>
              </div>
            </div>
            <div className="fs-footer-bottom">
              <div>© 2026 FastSpring Inc. All rights reserved. React 18 Engine & Python SQLite Backend.</div>
              <div>Privacy Policy | Terms of Sale | Cookie Preferences</div>
            </div>
          </footer>

          {/* AUTHENTICATION MODAL */}
          {showLoginModal && (
            <div className="fs-modal-overlay">
              <div className="fs-modal-box">
                <h3>Sign In to FastSpring</h3>
                <p style={{ color: '#64748b', fontSize: '0.92rem', marginBottom: '20px' }}>Access your digital quotes, inventory catalog, and invoices.</p>
                <form onSubmit={handleLogin}>
                  <label style={{ fontSize: '0.85rem', fontWeight: 700 }}>Username</label>
                  <input 
                    type="text" 
                    className="fs-input-field" 
                    placeholder="e.g. rahul_sharma or admin_user" 
                    value={loginUser}
                    onChange={(e) => setLoginUser(e.target.value)}
                    required 
                  />
                  <label style={{ fontSize: '0.85rem', fontWeight: 700 }}>Password</label>
                  <input 
                    type="password" 
                    className="fs-input-field" 
                    placeholder="••••••••" 
                    value={loginPass}
                    onChange={(e) => setLoginPass(e.target.value)}
                    required 
                  />
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '18px' }}>
                    <button type="button" className="fs-btn-outline" style={{ padding: '6px 12px', fontSize: '0.8rem' }} onClick={() => { setLoginUser('rahul_sharma'); setLoginPass('pass123'); }}>
                      Demo Customer
                    </button>
                    <button type="button" className="fs-btn-outline" style={{ padding: '6px 12px', fontSize: '0.8rem' }} onClick={() => { setLoginUser('admin_user'); setLoginPass('admin123'); }}>
                      Demo Admin
                    </button>
                  </div>
                  <button type="submit" className="fs-btn-orange" style={{ width: '100%', padding: '12px' }}>Sign In</button>
                  <button type="button" className="fs-btn-outline" style={{ width: '100%', marginTop: '8px', padding: '10px' }} onClick={() => setShowLoginModal(false)}>Cancel</button>
                </form>
              </div>
            </div>
          )}

          {/* INVOICE RESULT MODAL */}
          {showInvoiceModal && invoiceResult && (
            <div className="fs-modal-overlay">
              <div className="fs-modal-box" style={{ maxWidth: '680px' }}>
                <h3>Invoice #SALES-{invoiceResult.order_id} Ready</h3>
                <div style={{ background: '#0f172a', color: '#f8fafc', fontFamily: "'JetBrains Mono', monospace", fontSize: '0.85rem', padding: '18px', borderRadius: '12px', maxHeight: '360px', overflowY: 'auto', whiteSpace: 'pre-wrap', margin: '16px 0' }}>
                  {invoiceResult.receipt_text}
                </div>
                <div style={{ display: 'flex', gap: '12px' }}>
                  <button className="fs-btn-orange" style={{ flex: 1 }} onClick={() => window.print()}><Icons.Printer size={16} color="#ffffff" /> Print / Save PDF</button>
                  <button className="fs-btn-outline" style={{ flex: 1 }} onClick={() => setShowInvoiceModal(false)}>Done</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<FastSpringApp />, document.getElementById('root'));
  </script>
</body>
</html>
