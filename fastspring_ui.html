<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>billEX — Smart Multi-Tenant POS & Enterprise Billing Suite</title>
  
  <!-- billEX Brand Typography (Figtree & JetBrains Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel for Component Architecture -->
  <script src="/web/vendor/react.production.min.js"></script>
  <script src="/web/vendor/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --main-font: 'Figtree', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --main-link-color: #1479ce;
      --primary-orange: #ff772a;
      --primary-orange-hover: #e05e13;
      --main-heading-color: #16181a;
      --main-text-color: #5a6266;
      --bg-light: #f8fafc;
      --border-color: #ececec;
      --border-blue: #b3dcff;
      --card-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--main-font);
      color: var(--main-text-color);
      background-color: #ffffff;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    /* TOP ANNOUNCEMENT BANNER */
    .top-announcement {
      background-color: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 10px 24px;
      font-size: 0.88rem;
      color: var(--main-heading-color);
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    .top-announcement a {
      color: var(--main-link-color);
      text-decoration: underline;
      font-weight: 600;
      margin-left: 6px;
      cursor: pointer;
    }

    /* GLOBAL HEADER & NAVIGATION BAR */
    header.fs-nav {
      position: sticky;
      top: 0;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
      padding: 0 40px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .fs-nav-left {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    /* billEX Modern Vector Brand */
    .billex-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
    }
    .billex-logo-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #16181a 0%, #0f172a 100%);
      border: 1.5px solid var(--primary-orange);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(255, 119, 42, 0.25);
    }
    .billex-logo-text {
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #16181a;
      display: flex;
      align-items: baseline;
      gap: 2px;
    }
    .billex-logo-text .orange {
      color: var(--primary-orange);
    }
    .billex-logo-pill {
      font-size: 0.65rem;
      font-weight: 800;
      background: rgba(20, 121, 206, 0.1);
      color: #1479ce;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 4px;
      letter-spacing: 0.05em;
    }

    /* Store Active Identity Badge */
    .store-badge-nav {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #1e293b;
    }

    .fs-nav-links {
      display: flex;
      align-items: center;
      list-style: none;
      gap: 22px;
    }
    .fs-nav-links li a {
      color: var(--main-heading-color);
      text-decoration: none;
      font-size: 0.94rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: color 0.15s ease;
    }
    .fs-nav-links li a:hover {
      color: var(--main-link-color);
    }

    .fs-nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .nav-text-link {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--main-heading-color);
      cursor: pointer;
      text-decoration: none;
    }
    .nav-text-link:hover {
      color: var(--main-link-color);
    }

    /* Role Badges */
    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .role-badge.owner {
      background: rgba(255, 119, 42, 0.12);
      color: #ea580c;
      border: 1px solid rgba(255, 119, 42, 0.3);
    }
    .role-badge.cashier {
      background: rgba(16, 185, 129, 0.12);
      color: #059669;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .fs-btn-orange {
      background-color: var(--primary-orange);
      color: #ffffff;
      border: none;
      padding: 10px 22px;
      font-size: 0.94rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .fs-btn-orange:hover {
      background-color: var(--primary-orange-hover);
    }
    .fs-btn-orange:active {
      transform: scale(0.98);
    }
    .fs-btn-outline {
      background-color: transparent;
      color: var(--main-heading-color);
      border: 1px solid #cbd5e1;
      padding: 10px 20px;
      font-size: 0.94rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .fs-btn-outline:hover {
      background-color: #f1f5f9;
      border-color: #94a3b8;
    }

    /* HERO SECTION */
    .fs-hero {
      max-width: 1280px;
      margin: 0 auto;
      padding: 56px 24px 40px;
      text-align: center;
    }
    .fs-badge-roi {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 119, 42, 0.08);
      border: 1px solid rgba(255, 119, 42, 0.25);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #ea580c;
      margin-bottom: 20px;
    }
    .fs-hero h1 {
      font-size: 3.4rem;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.03em;
      color: var(--main-heading-color);
      max-width: 900px;
      margin: 0 auto 20px;
    }
    .fs-hero h1 span.blue-line {
      color: var(--main-link-color);
      display: block;
    }
    .fs-hero p.subtitle {
      font-size: 1.2rem;
      color: var(--main-text-color);
      max-width: 780px;
      margin: 0 auto 32px;
      line-height: 1.6;
    }
    .fs-hero-ctas {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 48px;
    }

    /* APP WORKSPACE SECTION */
    .fs-app-workspace {
      max-width: 1280px;
      margin: 0 auto 80px;
      padding: 0 24px;
    }
    .fs-app-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
      overflow: hidden;
    }
    .fs-app-nav-tabs {
      display: flex;
      background: #f8fafc;
      border-bottom: 1px solid var(--border-color);
      padding: 0 20px;
      overflow-x: auto;
    }
    .fs-tab-btn {
      padding: 18px 24px;
      font-size: 0.94rem;
      font-weight: 700;
      color: #64748b;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .fs-tab-btn:hover {
      color: var(--main-link-color);
    }
    .fs-tab-btn.active {
      color: var(--main-link-color);
      border-bottom-color: var(--main-link-color);
      background: #ffffff;
    }

    .fs-tab-content {
      padding: 32px;
    }

    /* STOREFRONT & BILLING LAYOUT */
    .store-layout {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 32px;
    }
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      max-height: 640px;
      overflow-y: auto;
      padding-right: 8px;
    }
    .sku-item {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: box-shadow 0.2s ease, transform 0.15s ease;
    }
    .sku-item:hover {
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
      transform: translateY(-2px);
    }
    .sku-cat {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--main-link-color);
      margin-bottom: 4px;
    }
    .sku-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--main-heading-color);
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .sku-price {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--main-heading-color);
    }
    .sku-stock {
      font-size: 0.8rem;
      font-weight: 600;
      color: #10b981;
      margin-top: 4px;
    }

    /* POS BILLING DRAWER */
    .invoice-card {
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      background: #fbfcfe;
    }
    .invoice-card h3 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--main-heading-color);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* POS Customer Input Bar */
    .pos-cust-bar {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .pos-cust-bar label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: block;
      margin-bottom: 4px;
    }

    .cart-table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }
    .cart-table th {
      text-align: left;
      font-size: 0.82rem;
      color: #64748b;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }
    .cart-table td {
      padding: 10px 0;
      font-size: 0.9rem;
      border-bottom: 1px solid #f1f5f9;
      color: var(--main-heading-color);
    }
    .cart-table input[type=number]::-webkit-inner-spin-button,
    .cart-table input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .cart-table input[type=number] {
      -moz-appearance: textfield;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 0.92rem;
      color: var(--main-text-color);
    }
    .summary-row.total-bold {
      border-top: 1.5px solid var(--border-color);
      padding-top: 12px;
      margin-top: 8px;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--main-heading-color);
    }

    .fs-input-field {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.92rem;
      margin-top: 4px;
      margin-bottom: 12px;
      font-family: inherit;
      outline: none;
    }
    .fs-input-field:focus {
      border-color: var(--main-link-color);
      box-shadow: 0 0 0 3px rgba(20, 121, 206, 0.15);
    }

    /* ROUTE METRIC GRID */
    .route-metric-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }
    .route-metric-item {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 12px;
    }
    .route-metric-item .label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
    }
    .route-metric-item .val {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--main-heading-color);
      font-family: 'JetBrains Mono', monospace;
    }
    .route-card {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
    }

    /* STAFF TABLE */
    .staff-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }
    .staff-table th {
      text-align: left;
      font-size: 0.82rem;
      color: #64748b;
      padding: 10px;
      border-bottom: 2px solid #e2e8f0;
      background: #f8fafc;
    }
    .staff-table td {
      padding: 12px 10px;
      font-size: 0.92rem;
      border-bottom: 1px solid #f1f5f9;
      color: var(--main-heading-color);
    }

    /* FOOTER */
    .fs-footer {
      background: #f8fafc;
      border-top: 1px solid var(--border-color);
      padding: 48px 24px;
      margin-top: 80px;
    }
    .fs-footer-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 40px;
      margin-bottom: 36px;
    }
    .fs-footer-col h5 {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--main-heading-color);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }
    .fs-footer-col ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .fs-footer-col ul li a {
      color: var(--main-text-color);
      font-size: 0.9rem;
      text-decoration: none;
    }
    .fs-footer-bottom {
      max-width: 1200px;
      margin: 0 auto;
      border-top: 1px solid var(--border-color);
      padding-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    /* MODAL POPUPS */
    .fs-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .fs-modal-box {
      background: #ffffff;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      max-height: 90vh;
      overflow-y: auto;
    }
    .fs-modal-box h3 {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--main-heading-color);
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <!-- REACT ROOT CONTAINER -->
  <div id="root"></div>

  <!-- REACT 18 APPLICATION SCRIPT -->

    function BillExApp() {
      const [activeTab, setActiveTab] = useState('billing');
      const [products, setProducts] = useState([]);
      const [cart, setCart] = useState({});
      const [cities, setCities] = useState([]);
      const [destCity, setDestCity] = useState('Bengaluru');
      const [routeInfo, setRouteInfo] = useState(null);
      const [metrics, setMetrics] = useState(null);
      const [promoCode, setPromoCode] = useState('');
      const [promoInput, setPromoInput] = useState('');
      const [searchTerm, setSearchTerm] = useState('');
      
      // Store Identity State
      const [shop, setShop] = useState(null);
      const [staff, setStaff] = useState([]);
      
      // Auth State (Default: Store Owner)
      const [currentUser, setCurrentUser] = useState({ 
        user_id: 4, 
        username: 'admin_user', 
        full_name: 'Store Administrator',
        city: 'Bengaluru', 
        is_premium: false, 
        role: 'admin',
        shop_id: 1,
        shop_name: 'Apex Electronics & Retail'
      });
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [showRegisterShopModal, setShowRegisterShopModal] = useState(false);
      const [loginUser, setLoginUser] = useState('admin_user');
      const [loginPass, setLoginPass] = useState('admin123');

      // Customer POS Billing Fields
      const [customerName, setCustomerName] = useState('Walk-in Customer');
      const [customerPhone, setCustomerPhone] = useState('+91 9876543210');

      // Invoice Result Modal
      const [invoiceResult, setInvoiceResult] = useState(null);
      const [showInvoiceModal, setShowInvoiceModal] = useState(false);

      // Forms
      const [newSku, setNewSku] = useState({ name: '', category: 'Electronics', price: '', stock: '' });
      const [newEmployee, setNewEmployee] = useState({ full_name: '', username: '', password: '', email: '' });
      const [shopEditForm, setShopEditForm] = useState({ shop_name: '', address: '', gstin: '', phone: '', city: '' });
      const [newShopReg, setNewShopReg] = useState({ shop_name: '', address: '', gstin: '', phone: '', city: 'Bengaluru', username: '', password: '', email: '', full_name: '' });
      const [backupStatus, setBackupStatus] = useState('');
      const [toast, setToast] = useState(null);

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => {
          setToast(prev => (prev && prev.message === message ? null : prev));
        }, 3500);
      };

      const padCenter = (str, width = 62) => {
        const s = String(str || '');
        if (s.length >= width) return s.slice(0, width);
        const left = Math.floor((width - s.length) / 2);
        const right = width - s.length - left;
        return ' '.repeat(left) + s + ' '.repeat(right);
      };

      const isAdmin = currentUser && (currentUser.role === 'admin' || currentUser.role === 'owner');
      const isCashier = currentUser && (currentUser.role === 'cashier' || currentUser.role === 'employee');

      useEffect(() => {
        // Fetch Initial Products and Shop Info
        fetch('/api/products').then(r => r.json()).then(setProducts);
        fetchShopDetails(currentUser.shop_id || 1);
        fetchStaffList(currentUser.shop_id || 1);
        fetch('/api/cities').then(r => r.json()).then(data => {
          setCities(data);
          if (data.length > 0) {
            fetchRoute(data.includes('Bengaluru') ? 'Bengaluru' : data[0]);
          }
        });
        fetchMetrics();
      }, [currentUser.shop_id]);

      const fetchShopDetails = (sid = 1) => {
        fetch(`/api/shop?shop_id=${sid}`)
          .then(r => r.json())
          .then(data => {
            if (!data.error) {
              setShop(data);
              setShopEditForm({
                shop_name: data.shop_name,
                address: data.address,
                gstin: data.gstin || '',
                phone: data.phone || '',
                city: data.city || 'Bengaluru'
              });
            }
          });
      };

      const fetchStaffList = (sid = 1) => {
        fetch(`/api/staff?shop_id=${sid}`)
          .then(r => r.json())
          .then(setStaff);
      };

      const fetchMetrics = () => {
        fetch('/api/metrics').then(r => r.json()).then(setMetrics);
      };

      const fetchRoute = (city) => {
        setDestCity(city);
        fetch(`/api/route?dest=${encodeURIComponent(city)}`)
          .then(r => r.json())
          .then(setRouteInfo);
      };

      const addToCart = (pid) => {
        const p = products.find(x => x.product_id == pid);
        if (!p) return;
        const currentQty = cart[pid] || 0;
        if (currentQty >= p.stock) {
          showToast(`Insufficient stock. Only ${p.stock} units available for ${p.name}.`, 'warning');
          return;
        }
        setCart(prev => ({ ...prev, [pid]: currentQty + 1 }));
      };

      const incrementCart = (pid) => {
        const p = products.find(x => x.product_id == pid);
        if (!p) return;
        const currentQty = cart[pid] || 0;
        if (currentQty >= p.stock) {
          showToast(`Maximum available stock (${p.stock}) reached for ${p.name}.`, 'warning');
          return;
        }
        setCart(prev => ({ ...prev, [pid]: currentQty + 1 }));
      };

      const decrementCart = (pid) => {
        setCart(prev => {
          const currentQty = prev[pid] || 0;
          if (currentQty <= 1) {
            const next = { ...prev };
            delete next[pid];
            return next;
          }
          return { ...prev, [pid]: currentQty - 1 };
        });
      };

      const updateCartQuantity = (pid, valStr) => {
        const p = products.find(x => x.product_id == pid);
        if (!p) return;
        const parsed = parseInt(valStr, 10);
        if (isNaN(parsed) || parsed <= 0) {
          setCart(prev => {
            const next = { ...prev };
            delete next[pid];
            return next;
          });
          return;
        }
        if (parsed > p.stock) {
          showToast(`Only ${p.stock} units in stock for ${p.name}. Quantity adjusted to available limit.`, 'warning');
          setCart(prev => ({ ...prev, [pid]: p.stock }));
          return;
        }
        setCart(prev => ({ ...prev, [pid]: parsed }));
      };

      const removeFromCart = (pid) => {
        setCart(prev => {
          const next = { ...prev };
          delete next[pid];
          return next;
        });
      };

      const clearCart = () => setCart({});

      // Calculations
      const cartKeys = Object.keys(cart);
      let subtotal = 0;
      let totalItems = 0;
      cartKeys.forEach(pid => {
        const p = products.find(x => x.product_id == pid);
        if (p) {
          subtotal += p.price * cart[pid];
          totalItems += cart[pid];
        }
      });

      let discount = currentUser.is_premium ? subtotal * 0.10 : 0.0;
      if (promoCode === 'SMART10') {
        discount += subtotal * 0.10;
      }
      const taxable = Math.max(0, subtotal - discount);
      const tax = taxable * 0.05;
      const freight = (destCity === (shop ? shop.city : 'Bengaluru')) ? 0.0 : ((routeInfo && routeInfo.distance) ? (routeInfo.distance * 0.45) : 120.0);
      const totalAmount = taxable + tax + freight;

      const handleCheckout = async () => {
        if (cartKeys.length === 0) {
          showToast('Your POS billing cart is empty. Add products from the warehouse catalog first.', 'warning');
          return;
        }
        const itemsPayload = cartKeys.map(k => ({ product_id: parseInt(k), quantity: cart[k] }));
        const res = await fetch('/api/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: currentUser.user_id,
            items: itemsPayload,
            dest_city: destCity,
            promo_code: promoCode,
            customer_name: customerName.trim() || 'Walk-in Customer',
            customer_phone: customerPhone.trim(),
            billed_by_user_id: currentUser.user_id,
            shop_id: currentUser.shop_id || 1
          })
        });
        const data = await res.json();
        if (data.success) {
          setInvoiceResult(data);
          setShowInvoiceModal(true);
          clearCart();
          fetch('/api/products').then(r => r.json()).then(setProducts);
          fetchMetrics();
        } else {
          showToast('Error: ' + data.error, 'error');
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: loginUser, password: loginPass })
        });
        const data = await res.json();
        if (data.success) {
          setCurrentUser(data.user);
          setShowLoginModal(false);
          fetchShopDetails(data.user.shop_id || 1);
          fetchStaffList(data.user.shop_id || 1);
          showToast(`Signed in successfully as ${data.user.full_name || data.user.username} (${data.user.role.toUpperCase()})`, 'success');
        } else {
          showToast(data.error, 'error');
        }
      };

      const handleUpdateShop = async (e) => {
        e.preventDefault();
        const res = await fetch('/api/shop/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ shop_id: currentUser.shop_id || 1, ...shopEditForm })
        });
        const data = await res.json();
        if (data.success) {
          setShop(data.shop);
          showToast('Store identity and invoice branding updated successfully!', 'success');
        } else {
          showToast(data.error, 'error');
        }
      };

      const handleCreateStaff = async (e) => {
        e.preventDefault();
        const res = await fetch('/api/staff/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ shop_id: currentUser.shop_id || 1, ...newEmployee })
        });
        const data = await res.json();
        if (data.success) {
          showToast(data.message, 'success');
          setNewEmployee({ full_name: '', username: '', password: '', email: '' });
          setStaff(data.staff);
        } else {
          showToast(data.error, 'error');
        }
      };

      const handleRegisterNewShop = async (e) => {
        e.preventDefault();
        const res = await fetch('/api/shop/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newShopReg)
        });
        const data = await res.json();
        if (data.success) {
          showToast(`Congratulations! ${newShopReg.shop_name} has been created and launched.`, 'success');
          setCurrentUser(data.user);
          setShowRegisterShopModal(false);
          fetchShopDetails(data.user.shop_id);
          fetchStaffList(data.user.shop_id);
        } else {
          showToast(data.error, 'error');
        }
      };

      const handleRegisterSku = async (e) => {
        e.preventDefault();
        const res = await fetch('/api/add_sku', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newSku)
        });
        const data = await res.json();
        if (data.success) {
          showToast(`Product SKU registered with ID #${data.product_id}!`, 'success');
          setNewSku({ name: '', category: 'Electronics', price: '', stock: '' });
          fetch('/api/products').then(r => r.json()).then(setProducts);
        }
      };

      const handleBackup = async () => {
        const res = await fetch('/api/backup', { method: 'POST' });
        const d = await res.json();
        setBackupStatus(`SQLite archive snapshot created: ${d.backup_path}`);
      };

      const filteredProducts = products.filter(p => 
        p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
        p.category.toLowerCase().includes(searchTerm.toLowerCase())
      );

      return (
        <div>
          {/* TOP ANNOUNCEMENT BANNER */}
          <div className="top-announcement">
            <span>
              <Icons.Lightbulb size={18} color="#f59e0b" /> 
              <strong>billEX Multi-Tenant Suite</strong>: Active Store: <strong>{shop ? shop.shop_name : 'Loading...'}</strong> ({shop ? `${shop.city} • GSTIN: ${shop.gstin}` : ''}).

            <a onClick={() => setShowRegisterShopModal(true)} style={{ display: 'inline-flex', alignItems: 'center' }}>

            </a>
          </div>

          {/* GLOBAL NAVIGATION BAR */}

                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <rect x="2" y="3" width="20" height="18" rx="4" fill="#FF772A" />
                    <path d="M7 8h10M7 12h6M7 16h8" stroke="#ffffff" strokeWidth="2.2" strokeLinecap="round" />
                    <circle cx="17" cy="15" r="2.2" fill="#1479CE" />
                  </svg>
                </div>
                <div className="billex-logo-text">
                  bill<span className="orange">EX</span>
                  <span className="billex-logo-pill">POS</span>

              </div>

              {/* Active Shop Badge */}

                <span>{shop ? shop.shop_name : 'Apex Electronics'}</span>
              </div>

              <ul className="fs-nav-links">
                <li><a onClick={() => { setActiveTab('billing'); document.getElementById('workspace').scrollIntoView({ behavior: 'smooth' }); }}>POS Billing <Icons.ChevronDown size={11} color="#94a3b8" /></a></li>
                <li><a onClick={() => { setActiveTab('catalog'); document.getElementById('workspace').scrollIntoView({ behavior: 'smooth' }); }}>Warehouse Inventory <Icons.ChevronDown size={11} color="#94a3b8" /></a></li>

                <li><a onClick={() => { setActiveTab('store'); document.getElementById('workspace').scrollIntoView({ behavior: 'smooth' }); }}>Store Identity & GST {!isAdmin && <Icons.Lock size={12} color="#94a3b8" />}</a></li>

                            value={shopEditForm.address}
                            onChange={(e) => setShopEditForm({ ...shopEditForm, address: e.target.value })}
                            required 
                          />
                          <label style={{ fontSize: '0.82rem', fontWeight: 700, color: '#64748b' }}>GSTIN / TAX IDENTIFICATION</label>
                          <input 
                            type="text" 
                            className="fs-input-field" 
                            value={shopEditForm.gstin}
                            onChange={(e) => setShopEditForm({ ...shopEditForm, gstin: e.target.value })}
                          />
                          <label style={{ fontSize: '0.82rem', fontWeight: 700, color: '#64748b' }}>OFFICIAL STORE PHONE</label>
                          <input 
                            type="text" 
                            className="fs-input-field" 
                            value={shopEditForm.phone}
                            onChange={(e) => setShopEditForm({ ...shopEditForm, phone: e.target.value })}
                          />
                          <label style={{ fontSize: '0.82rem', fontWeight: 700, color: '#64748b' }}>BASE CITY / LOGISTICS HUB</label>
                          <input 
                            type="text" 
                            className="fs-input-field" 
                            value={shopEditForm.city}
                            onChange={(e) => setShopEditForm({ ...shopEditForm, city: e.target.value })}
                          />
                          <button type="submit" className="fs-btn-orange" style={{ width: '100%' }}>
                            Save Store Profile &amp; Invoice Header
                          </button>
                        </form>
                      </div>

                      {/* Live Preview of Invoice Header */}
                      <div className="invoice-card">
                        <h4>Live Header Preview on Invoices</h4>
                        <div style={{ background: '#0f172a', color: '#f8fafc', fontFamily: "'JetBrains Mono', monospace", fontSize: '0.85rem', padding: '20px', borderRadius: '12px', marginTop: '14px', whiteSpace: 'pre-wrap' }}>
{`==============================================================
            billEX POINT OF SALE & DIGITAL INVOICE            
${padCenter((shopEditForm.shop_name || 'Apex Electronics & Retail').toUpperCase(), 62)}
${padCenter((shopEditForm.address || 'Shop #14, Brigade Road, Bengaluru - 560001').slice(0, 60), 62)}
${padCenter(`GSTIN: ${shopEditForm.gstin || '29ABCDE1234F1Z5'} | Phone: ${shopEditForm.phone || '+91 9876543210'}`, 62)}
==============================================================
INVOICE #: SALES-SAMPLE      DATE: 2026-11-01 10:00:00
CUSTOMER : Walk-in Customer  CITY: ${shopEditForm.city || 'Bengaluru'}
BILLED BY: Cashier Staff     COUNTER: POS-Terminal-01
--------------------------------------------------------------`}
                        </div>
                        <p style={{ fontSize: '0.85rem', color: '#64748b', marginTop: '12px' }}>
                          Every customer receipt automatically displays this exact header.
                        </p>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* TAB 5: DIJKSTRA LOGISTICS ROUTING */}
              {activeTab === 'route' && (
                <div className="fs-tab-content">
                  <h3 style={{ fontSize: '1.45rem', fontWeight: 800, color: 'var(--main-heading-color)', marginBottom: '8px' }}>
                    Dijkstra Logistics Telemetry &amp; Shortest-Path Optimizer
                  </h3>
                  <p style={{ color: 'var(--main-text-color)', marginBottom: '24px' }}>
                    Calculated via SciPy Compressed Sparse Row (CSR) algorithms on the 21-node national highway network.
                  </p>
                  <div className="route-metric-grid">
                    <div className="route-metric-item">
                      <div className="label"><Icons.Road size={16} color="#1479ce" /> Route Distance</div>
                      <div className="val">{routeInfo ? `${routeInfo.distance.toLocaleString()} km` : '--'}</div>
                    </div>
                    <div className="route-metric-item">
                      <div className="label"><Icons.Clock size={16} color="#1479ce" /> Estimated Transit</div>
                      <div className="val">{routeInfo ? `${routeInfo.est_days} days` : '--'}</div>
                    </div>
                    <div className="route-metric-item">
                      <div className="label"><Icons.Fuel size={16} color="#1479ce" /> Fuel Consumption</div>
                      <div className="val">{routeInfo ? `${routeInfo.fuel_burn} L` : '--'}</div>
                    </div>
                    <div className="route-metric-item">
                      <div className="label"><Icons.Leaf size={16} color="#10b981" /> Carbon Footprint</div>
                      <div className="val">{routeInfo ? `${routeInfo.co2_footprint} kg` : '--'}</div>
                    </div>
                  </div>
                  <div className="route-card">
                    <h4 style={{ fontSize: '1.1rem', fontWeight: 700, color: 'var(--main-heading-color)', marginBottom: '12px' }}>Active Highway Corridor:</h4>
                    <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: '1.05rem', color: '#1479ce', fontWeight: 700 }}>
                      {routeInfo ? (
                        <div style={{ display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: '4px' }}>
                          {routeInfo.path.map((city, idx) => (
                            <React.Fragment key={idx}>
                              <span>{city}</span>
                              {idx < routeInfo.path.length - 1 && (
                                <Icons.ArrowRight size={14} color="#1479ce" style={{ margin: '0 4px' }} />
                              )}
                            </React.Fragment>
                          ))}
                        </div>
                      ) : 'Select a destination city...'}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 6: FINANCIAL TELEMETRY & BI */}
              {activeTab === 'analytics' && (
                <div className="fs-tab-content">
                  <h3 style={{ fontSize: '1.45rem', fontWeight: 800, color: 'var(--main-heading-color)', marginBottom: '8px' }}>
                    Executive Business Intelligence &amp; Database Health
                  </h3>
                  <p style={{ color: 'var(--main-text-color)', marginBottom: '24px' }}>
                    Real-time metrics computed via NumPy array vectorization and SQLite transactions for {shop ? shop.shop_name : 'the store'}.
                  </p>
                  {metrics && (
                    <div className="route-metric-grid">
                      <div className="route-metric-item">
                        <div className="label">Gross Sales Volume</div>
                        <div className="val">₹{Number(metrics.total_revenue).toLocaleString('en-IN', { maximumFractionDigits: 0 })}</div>
                      </div>
                      <div className="route-metric-item">
                        <div className="label">Average Order Value</div>
                        <div className="val">₹{Number(metrics.average_order_value).toLocaleString('en-IN', { maximumFractionDigits: 0 })}</div>
                      </div>
                      <div className="route-metric-item">
                        <div className="label">Peak Ticket Cart</div>
                        <div className="val">₹{Number(metrics.max_order_value).toLocaleString('en-IN', { maximumFractionDigits: 0 })}</div>
                      </div>
                      <div className="route-metric-item">
                        <div className="label">Completed Transactions</div>
                        <div className="val">{metrics.order_count}</div>
                      </div>
                    </div>
                  )}

                  <div className="invoice-card" style={{ marginTop: '24px' }}>
                    <h4 style={{ display: "inline-flex", alignItems: "center" }}><Icons.Shield size={20} color="#1479ce" /> Database Cloud Archival &amp; Snapshots</h4>
                    <p style={{ fontSize: '0.92rem', color: 'var(--main-text-color)', margin: '12px 0' }}>
                      Snapshot master SQLite database across background daemon threads into <code>invoices/</code>.
                    </p>
                    <button className="fs-btn-outline" style={{ padding: '12px 20px' }} onClick={handleBackup}>
                      <Icons.Package size={16} color="currentColor" /> Create SQLite Database Snapshot
                    </button>
                    {backupStatus && (
                      <div style={{ marginTop: '16px', fontSize: '0.88rem', fontWeight: 600, color: '#10b981', display: 'flex', alignItems: 'center' }}>
                        <Icons.Check size={16} color="#10b981" /> {backupStatus}
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          </section>

          {/* BILLING FOOTER */}
          <footer className="fs-footer">
            <div className="fs-footer-grid">
              <div>
                <div className="billex-brand" style={{ marginBottom: '14px' }}>
                  <div className="billex-logo-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                      <rect x="2" y="3" width="20" height="18" rx="4" fill="#FF772A" />
                      <path d="M7 8h10M7 12h6M7 16h8" stroke="#ffffff" strokeWidth="2.2" strokeLinecap="round" />
                    </svg>
                  </div>
                  <div className="billex-logo-text">
                    bill<span className="orange">EX</span>
                    <span className="billex-logo-pill">POS</span>
                  </div>
                </div>
                <p style={{ fontSize: '0.9rem', color: '#64748b', lineHeight: 1.6, maxWidth: '320px' }}>
                  billEX is the modern multi-tenant point-of-sale and merchant billing platform for retail shops, supermarkets, and wholesale businesses.
                </p>
              </div>
              <div className="fs-footer-col">
                <h5>Modules</h5>
                <ul>
                  <li><a href="#">POS Billing Counter</a></li>
                  <li><a href="#">Storefront Identity</a></li>
                  <li><a href="#">Cashier Delegation</a></li>
                  <li><a href="#">Dijkstra Logistics</a></li>
                </ul>
              </div>
              <div className="fs-footer-col">
                <h5>Compliance</h5>
                <ul>
                  <li><a href="#">GST Tax Invoicing</a></li>
                  <li><a href="#">CSV Financial Export</a></li>
                  <li><a href="#">Relational SQLite ACID</a></li>
                  <li><a href="#">Role-Based Access</a></li>
                </ul>
              </div>
              <div className="fs-footer-col">
                <h5>Store Identity</h5>
                <ul>
                  <li><a href="#">{shop ? shop.shop_name : 'Apex Electronics'}</a></li>
                  <li><a href="#">{shop ? shop.city : 'Bengaluru'}</a></li>
                  <li><a href="#">GSTIN: {shop ? shop.gstin : '29ABCDE1234F1Z5'}</a></li>
                  <li><a href="#">Staff Count: {staff.length}</a></li>
                </ul>
              </div>
            </div>
            <div className="fs-footer-bottom">
              <div>© 2026 billEX POS Technologies. Multi-Tenant Enterprise Retail Billing Suite.</div>
              <div>Privacy Policy | Terms of Sale | Merchant Agreement</div>
            </div>
          </footer>

          {/* AUTHENTICATION & QUICK ROLE SWITCHER MODAL */}
          {showLoginModal && (
            <div className="fs-modal-overlay">
              <div className="fs-modal-box">
                <h3>Sign In / Switch Role</h3>
                <p style={{ color: '#64748b', fontSize: '0.92rem', marginBottom: '20px' }}>
                  Switch between Store Owner (Admin) and Employee (Cashier) accounts.
                </p>

                {/* Quick Role Switch Buttons */}
                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', marginBottom: '20px' }}>
                  <button type="button" className="fs-btn-outline" style={{ justifyContent: 'flex-start', padding: '10px 14px' }} onClick={() => { setLoginUser('admin_user'); setLoginPass('admin123'); }}>
                    <Icons.Shield size={16} color="#ea580c" /> <strong>Demo Store Owner (Admin)</strong> - admin_user
                  </button>
                  <button type="button" className="fs-btn-outline" style={{ justifyContent: 'flex-start', padding: '10px 14px' }} onClick={() => { setLoginUser('cashier_priya'); setLoginPass('cashier123'); }}>
                    <Icons.CreditCard size={16} color="#059669" /> <strong>Demo Cashier Staff (Priya)</strong> - cashier_priya
                  </button>
                  <button type="button" className="fs-btn-outline" style={{ justifyContent: 'flex-start', padding: '10px 14px' }} onClick={() => { setLoginUser('cashier_arun'); setLoginPass('cashier123'); }}>
                    <Icons.CreditCard size={16} color="#059669" /> <strong>Demo Cashier Staff (Arun)</strong> - cashier_arun
                  </button>
                </div>

                <form onSubmit={handleLogin}>
                  <label style={{ fontSize: '0.85rem', fontWeight: 700 }}>Username</label>
                  <input 
                    type="text" 
                    className="fs-input-field" 
                    value={loginUser}
                    onChange={(e) => setLoginUser(e.target.value)}
                    required 
                  />
                  <label style={{ fontSize: '0.85rem', fontWeight: 700 }}>Password</label>
                  <input 
                    type="password" 
                    className="fs-input-field" 
                    value={loginPass}
                    onChange={(e) => setLoginPass(e.target.value)}
                    required 
                  />
                  <button type="submit" className="fs-btn-orange" style={{ width: '100%', padding: '12px' }}>
                    Sign In to billEX
                  </button>
                  <div style={{ textAlign: 'center', margin: '14px 0 6px' }}>
                    <a onClick={() => { setShowLoginModal(false); setShowRegisterShopModal(true); }} style={{ color: 'var(--main-link-color)', fontSize: '0.88rem', fontWeight: 700, cursor: 'pointer' }}>
                      + Want to register a new store? Click here
                    </a>
                  </div>
                  <button type="button" className="fs-btn-outline" style={{ width: '100%', padding: '10px' }} onClick={() => setShowLoginModal(false)}>Cancel</button>
                </form>
              </div>
            </div>
          )}

          {/* REGISTER NEW SHOP ONBOARDING MODAL */}
          {showRegisterShopModal && (
            <div className="fs-modal-overlay">
              <div className="fs-modal-box" style={{ maxWidth: '520px' }}>
                <h3>Register Your Shop on billEX</h3>
                <p style={{ color: '#64748b', fontSize: '0.92rem', marginBottom: '20px' }}>
                  Onboard your store with custom address details and gain full Admin access.
                </p>
                <form onSubmit={handleRegisterNewShop}>
                  <label style={{ fontSize: '0.82rem', fontWeight: 700, color: '#64748b' }}>SHOP / STORE NAME</label>
                  <input 
                    type="text" 
                    className="fs-input-field" 
                    placeholder="e.g. Metro Hypermarket"
                    value={newShopReg.shop_name}
                    onChange={(e) => setNewShopReg({ ...newShopReg, shop_name: e.target.value })}
                    required 
                  />
                  <label style={{ fontSize: '0.82rem', fontWeight: 700, color: '#64748b' }}>PHYSICAL STORE ADDRESS</label>
                  <input 
                    type="text" 
                    className="fs-input-field" 
                    placeholder="e.g. Plot 45, MG Road, Pune - 411001"
                    value={newShopReg.address}
                    onChange={(e) => setNewShopReg({ ...newShopReg, address: e.target.value })}
                    required 
                  />
                  <div style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr', gap: '10px' }}>
                    <div>
                      <label style={{ fontSize: '0.82rem', fontWeight: 700, color: '#64748b' }}>GSTIN NUMBER</label>
                      <input 
                        type="text" 
                        className="fs-input-field" 
                        placeholder="27AABCU9603R1ZM"
                        value={newShopReg.gstin}
                        onChange={(e) => setNewShopReg({ ...newShopReg, gstin: e.target.value })}
                      />
                    </div>
                    <div>
                      <label style={{ fontSize: '0.82rem', fontWeight: 700, color: '#64748b' }}>STORE CITY</label>
                      <input 
                        type="text" 
                        className="fs-input-field" 
                        placeholder="Pune"
                        value={newShopReg.city}
                        onChange={(e) => setNewShopReg({ ...newShopReg, city: e.target.value })}
                        required 
                      />
                    </div>
                  </div>
                  <label style={{ fontSize: '0.82rem', fontWeight: 700, color: '#64748b' }}>STORE CONTACT PHONE</label>
                  <input 
                    type="text" 
                    className="fs-input-field" 
                    placeholder="+91 9123456789"
                    value={newShopReg.phone}
                    onChange={(e) => setNewShopReg({ ...newShopReg, phone: e.target.value })}
                  />
                  <hr style={{ border: 'none', borderTop: '1px solid #e2e8f0', margin: '14px 0' }} />
                  <label style={{ fontSize: '0.82rem', fontWeight: 700, color: '#64748b' }}>STORE OWNER FULL NAME</label>
                  <input 
                    type="text" 
                    className="fs-input-field" 
                    placeholder="e.g. Vikram Malhotra"
                    value={newShopReg.full_name}
                    onChange={(e) => setNewShopReg({ ...newShopReg, full_name: e.target.value })}
                    required 
                  />
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                    <div>
                      <label style={{ fontSize: '0.82rem', fontWeight: 700, color: '#64748b' }}>OWNER USERNAME</label>
                      <input 
                        type="text" 
                        className="fs-input-field" 
                        placeholder="vikram_owner"
                        value={newShopReg.username}
                        onChange={(e) => setNewShopReg({ ...newShopReg, username: e.target.value })}
                        required 
                      />
                    </div>
                    <div>
                      <label style={{ fontSize: '0.82rem', fontWeight: 700, color: '#64748b' }}>OWNER PASSWORD</label>
                      <input 
                        type="password" 
                        className="fs-input-field" 
                        placeholder="••••••••"
                        value={newShopReg.password}
                        onChange={(e) => setNewShopReg({ ...newShopReg, password: e.target.value })}
                        required 
                      />
                    </div>
                  </div>
                  <button type="submit" className="fs-btn-orange" style={{ width: '100%', padding: '12px', marginTop: '6px' }}>
                    Register Store &amp; Launch Admin Access
                  </button>
                  <button type="button" className="fs-btn-outline" style={{ width: '100%', marginTop: '8px', padding: '10px' }} onClick={() => setShowRegisterShopModal(false)}>Cancel</button>
                </form>
              </div>
            </div>
          )}

          {/* OFFICIAL INVOICE RESULT MODAL */}
          {showInvoiceModal && invoiceResult && (
            <div className="fs-modal-overlay">
              <div className="fs-modal-box" style={{ maxWidth: '680px' }}>
                <h3>Official billEX Invoice #SALES-{invoiceResult.order_id}</h3>
                <div style={{ background: '#0f172a', color: '#f8fafc', fontFamily: "'JetBrains Mono', monospace", fontSize: '0.85rem', padding: '18px', borderRadius: '12px', maxHeight: '380px', overflowY: 'auto', whiteSpace: 'pre-wrap', margin: '16px 0' }}>
                  {invoiceResult.receipt_text}
                </div>
                <div style={{ display: 'flex', gap: '12px' }}>
                  <button className="fs-btn-orange" style={{ flex: 1 }} onClick={() => window.print()}><Icons.Printer size={16} color="#ffffff" /> Print / Save PDF</button>
                  <button className="fs-btn-outline" style={{ flex: 1 }} onClick={() => setShowInvoiceModal(false)}>Done</button>
                </div>
              </div>
            </div>
          )}

          {/* NON-BLOCKING TOAST NOTIFICATION */}
          {toast && (
            <div 
              className={`bill-toast bill-toast-${toast.type}`} 
              role="status" 
              aria-live="polite"
              style={{
                position: 'fixed',
                bottom: '24px',
                right: '24px',
                zIndex: 99999,
                display: 'flex',
                alignItems: 'center',
                gap: '12px',
                backgroundColor: '#16181a',
                color: '#ffffff',
                padding: '12px 20px',
                borderRadius: '8px',
                boxShadow: '0 12px 32px -4px rgba(0, 0, 0, 0.28)',
                fontSize: '0.92rem',
                fontWeight: 600,
                borderLeft: toast.type === 'success' ? '4px solid #10b981' : (toast.type === 'error' ? '4px solid #ef4444' : (toast.type === 'warning' ? '4px solid #f59e0b' : '4px solid #1479ce'))
              }}
            >
              {toast.type === 'success' && <Icons.Check size={18} color="#10b981" />}
              {toast.type === 'error' && <Icons.Lock size={18} color="#ef4444" />}
              {toast.type === 'warning' && <Icons.Shield size={18} color="#f59e0b" />}
              {toast.type === 'info' && <Icons.Store size={18} color="#1479ce" />}
              <span>{toast.message}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<BillExApp />, document.getElementById('root'));
  </script>
</body>
</html>
